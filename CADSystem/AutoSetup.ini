[AUTOSETUP]
/// Microsoft_Setup, если равен Yes и Microsoft.NET Framework v.2, Windows Installer 3.1 v.2, Visual C++ Redistributable не установлены, 
/// программа автообновления будет пытаться их установить.Если равен No и Microsoft.NET Framework v.2 и
/// Windows Installer 3.1 v.2 установлены не будут (возможны ошибки в дальнейшей работе программы).
Microsoft_Setup=Yes
/// Установка таймаута выполнения программы AutoSetup.exe в миллисекундах
StartTimeoutAutoSetup=0
/// Если в процессе обновления файлы на клиенте были заняты, для завершения обновления необходимо перезагрузить ПК. 
/// ShowWindowReboot управляет отображением окна с сообщением о перезагрузке.
ShowWindowReboot=No